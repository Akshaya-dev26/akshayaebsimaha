{% extends "base.html" %}

{% block content %}

<section class="auth-section">

```
<div class="auth-card card">

    <div class="auth-header">

        <span class="badge">
            POCKETSMART AI
        </span>

        <h1>
            Welcome back
        </h1>

        <p>
            Sign in to continue planning your budget.
        </p>

    </div>


    <form id="loginForm">

        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

        </div>


        <button
            type="submit"
            class="btn primary"
            id="loginBtn"
        >
            Login
        </button>

    </form>


    <p
        id="message"
        class="message"
    ></p>


    <div class="auth-footer">

        <span>
            Don't have an account?
        </span>

        <a href="/register">
            Create Account
        </a>

    </div>

</div>
```

</section>

<script>

document
    .getElementById("loginForm")
    .addEventListener("submit", async function (event) {

        event.preventDefault();

        const button =
            document.getElementById("loginBtn");

        const message =
            document.getElementById("message");

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;


        button.disabled = true;

        button.textContent = "Logging in...";

        message.textContent = "";


        try {

            const response =
                await fetch("/api/login", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        password: password
                    })

                });


            const data =
                await response.json();


            if (!response.ok) {

                message.textContent =
                    data.detail ||
                    "Login failed.";

                message.style.color =
                    "#c0392b";

                return;

            }


            const accessToken =
                data.access_token ||
                data.token;


            if (accessToken) {

                localStorage.setItem(
                    "token",
                    accessToken
                );

            }


            message.textContent =
                "Login successful!";

            message.style.color =
                "#2e7d32";


            setTimeout(function () {

                window.location.href = "/";

            }, 500);


        } catch (error) {

            console.error(error);

            message.textContent =
                "Cannot connect to server.";

            message.style.color =
                "#c0392b";

        } finally {

            button.disabled = false;

            button.textContent = "Login";

        }

    });

</script>

{% endblock %}
