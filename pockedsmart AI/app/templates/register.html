{% extends "base.html" %}


{% block content %}

<div class="auth-card card">

    <h1>
        Create Account
    </h1>

    <p>
        Create an account to save
        your recommendations.
    </p>


    <form id="registerForm">

        <label>

            Name

            <input
                name="name"
                required
                minlength="2"
            >

        </label>


        <label>

            Email

            <input
                name="email"
                type="email"
                required
            >

        </label>


        <label>

            Password

            <input
                name="password"
                type="password"
                minlength="6"
                required
            >

        </label>


        <button
            class="btn primary full"
            type="submit"
        >
            Register
        </button>

    </form>


    <p class="muted">

        Already registered?

        <a href="/login">
            Login
        </a>

    </p>


    <div id="message"></div>

</div>

{% endblock %}


{% block scripts %}

<script>

document
    .getElementById("registerForm")
    .addEventListener(
        "submit",
        async (event) => {

            event.preventDefault();

            const data =
                Object.fromEntries(
                    new FormData(
                        event.target
                    )
                );

            const result =
                await api(
                    "/api/register",
                    {
                        method: "POST",
                        body: JSON.stringify(data)
                    }
                );

            if (result.ok) {

                localStorage.setItem(
                    "token",
                    result.data.access_token
                );

                location.href = "/";

            } else {

                showMessage(
                    result.data.detail ||
                    "Registration failed",
                    true
                );
            }
        }
    );

</script>

{% endblock %}
